<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/YemekChat-Kafa.png">
<title>YemekChat</title>
<script>
/* Adres büyük harfle yazıldıysa (ör. /Kurulum, /RESTORAN) küçük harfli haline gönderir.
   Sunucu büyük-küçük harfi ayrı adres saydığı için bu sayfa araya girip düzeltir. */
function kucukYol(yol){
  return yol.replace(/İ/g,"i").replace(/I/g,"i").replace(/ı/g,"i").toLowerCase().replace(/\.html$/,"");
}
(function(){
  var yol = location.pathname, yeni = kucukYol(yol);
  if (yeni !== yol) location.replace(yeni + location.search + location.hash);
})();
</script>
<style>
:root{--bg:#FAF8F7;--ink:#1A1716;--muted:#655E5B;--red:#FA0202}
@media (prefers-color-scheme: dark){:root{--bg:#121010;--ink:#F3EFEC;--muted:#A8A09C}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:72px 20px;text-align:center}
img{width:64px;height:64px;border-radius:16px}
h1{font-size:28px;margin:20px 0 8px}
p{color:var(--muted);margin:0 0 28px}
a.btn{display:inline-block;padding:14px 22px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="/YemekChat-Kafa.png" alt="">
  <h1>Bu sayfa bulunamadı</h1>
  <p>Adresi yanlış yazmış olabilirsiniz. Ana sayfadan devam edebilirsiniz.</p>
  <a class="btn" href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
