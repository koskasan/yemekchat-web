<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YemekChat - Teslimat Bölgeleri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css">
<style>
  :root{
    --bg:#111B14; --card:#1C2A20; --card2:#243530; --line:#2C3E32;
    --txt:#F1EFE8; --txt2:#B4B2A9; --txt3:#888780; --muted:#5F5E5A;
    --green:#1D9E75; --greenDark:#04342C; --mint:#9FE1CB; --red:#E24B4A;
    --amber:#EF9F27; --blue:#378ADD;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}

  .top{background:var(--card);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--line)}
  .top .logo{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#FCEBEB;font-weight:700;font-size:13px;flex-shrink:0}
  .top .nm{font-size:14px;font-weight:600}
  .top .sb{font-size:11px;color:var(--mint)}
  .top .sp{margin-left:auto;display:flex;gap:7px}
  .btn{background:var(--card2);border:none;color:var(--txt2);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.pri{background:var(--green);color:var(--greenDark)}
  .btn.gh{background:none;color:var(--txt3)}

  .bar{background:var(--card);padding:9px 12px;display:flex;gap:7px;align-items:center;overflow-x:auto;border-bottom:.5px solid var(--line);scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .mode{flex-shrink:0;background:var(--bg);border:1px solid var(--line);color:var(--txt2);border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .mode.on{background:var(--green);border-color:var(--green);color:var(--greenDark);font-weight:600}
  /* renk paleti */
  .palbar{background:var(--card);padding:8px 12px;display:flex;gap:7px;align-items:center;overflow-x:auto;border-bottom:.5px solid var(--line);scrollbar-width:none}
  .palbar::-webkit-scrollbar{display:none}
  .pchip{flex-shrink:0;border:2px solid transparent;border-radius:16px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:#10231a;line-height:1}
  .pchip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
  .pedit{flex-shrink:0;margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--mint);border-radius:16px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .pbox{position:absolute;left:10px;right:10px;top:10px;z-index:1200;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:none;max-height:80%;overflow-y:auto}
  .pbox.on{display:block}
  .pbox h4{font-size:13px;margin-bottom:4px}
  .pbox .ph{font-size:11.5px;color:var(--txt3);line-height:1.6;margin-bottom:10px}
  .prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .prow input[type=color]{width:44px;height:38px;border:none;background:none;padding:0;cursor:pointer}
  .prow input[type=number]{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;color:var(--txt);font-family:inherit}
  .prow .sil{background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;padding:4px 6px}
  .prow span{font-size:11px;color:var(--txt3);width:22px;text-align:right}
  .pfoot{display:flex;gap:7px;margin-top:12px}
  .pfoot button{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer}
  .pfoot .ek{background:var(--card2);color:var(--mint)}
  .pfoot .sf{background:var(--card2);color:var(--txt2)}
  .pfoot .kp{background:var(--green);color:var(--greenDark)}
  .att2{position:absolute;left:8px;bottom:50px;z-index:400;font-size:9.5px;color:var(--muted);background:rgba(17,27,20,.7);padding:2px 6px;border-radius:6px}

  #map{position:absolute;left:0;right:0;top:0;bottom:0;background:#0d140f}
  .wrap{position:relative;height:calc(100% - 150px)}
  .leaflet-container{background:#0d140f}

  .hint{position:absolute;left:10px;right:10px;bottom:116px;z-index:500;background:rgba(28,42,32,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--txt2);line-height:1.6}
  .hint b{color:var(--mint)}
  .hint .x{float:right;color:var(--txt3);cursor:pointer;font-size:14px;margin-left:8px}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:56%;display:flex;flex-direction:column;transform:translateY(calc(100% - 46px));transition:transform .22s}
  .sheet.open{transform:translateY(0)}
  .sheet .hd{padding:14px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
  .sheet .hd h4{font-size:13px;font-weight:600}
  .sheet .hd .cnt{font-size:11px;color:var(--mint);background:var(--card2);padding:2px 8px;border-radius:10px}
  .sheet .hd .ar{margin-left:auto;color:var(--txt3)}
  .sheet .bd{padding:0 16px 18px;overflow-y:auto}
  .zr{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:13px}
  .zr .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
  .zr .zn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zr .zu{color:var(--mint);font-weight:600}
  .zr button{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px 4px}

  .srch{position:absolute;left:56px;right:10px;top:10px;z-index:1100;display:none}
  .srch.on{display:block}
  .srch .row{display:flex;gap:7px}
  .srch input{flex:1;background:rgba(28,42,32,.96);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;color:var(--txt);font-family:inherit}
  .srch .res{background:rgba(28,42,32,.98);border:1px solid var(--line);border-radius:11px;margin-top:6px;overflow:hidden;display:none}
  .srch .res.on{display:block}
  .srch .res div{padding:11px 13px;font-size:13px;border-bottom:.5px solid var(--line);cursor:pointer}
  .srch .res div:last-child{border-bottom:none}

  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:700;background:var(--greenDark);color:var(--mint);border:1px solid var(--green);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;display:none}
  .toast.on{display:block}
  /* restoran konumu (mavi nokta) */
  .me{width:16px;height:16px;border-radius:50%;background:#2E86FF;border:3px solid #fff;box-shadow:0 0 0 0 rgba(46,134,255,.6);animation:mepulse 2s infinite}
  @keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(46,134,255,.55)}70%{box-shadow:0 0 0 20px rgba(46,134,255,0)}100%{box-shadow:0 0 0 0 rgba(46,134,255,0)}}

  /* ücret etiketi */
  .ftag{background:rgba(10,16,12,.82);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;white-space:nowrap;box-shadow:none}
  .ftag::before{display:none}

  /* renk açıklaması */
  .lgnd{position:absolute;left:10px;bottom:56px;z-index:500;background:rgba(28,42,32,.94);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10.5px;color:var(--txt2);line-height:1.75}
  .lgnd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .lgnd .att{color:var(--muted);font-size:9.5px;margin-top:3px;padding-top:3px;border-top:1px solid var(--line)}
  .lgnd.kapali{padding:6px 9px}
  .lgnd .tgl{color:var(--txt3);cursor:pointer;font-weight:700}

  .pop b{color:#04342C}
  .leaflet-popup-content{margin:10px 12px;font-size:13px}
  .leaflet-popup-content button{background:var(--card2);border:none;color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px;margin:6px 4px 0 0;cursor:pointer}
  .leaflet-popup-content button.d{background:#3a1715;color:#F09595}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--txt)}
  .leaflet-popup-tip{background:var(--card)}
</style>
</head>
<body>

<div class="top">
  <div class="logo">YC</div>
  <div>
    <div class="nm" id="rName">Teslimat Bölgeleri</div>
    <div class="sb" id="rSub">yükleniyor…</div>
  </div>
  <div class="sp">
    <button class="btn gh" onclick="location.href='restoran.html'">← Panel</button>
    <button class="btn pri" id="btnSave">💾 Kaydet</button>
  </div>
</div>

<div class="bar">
  <div class="mode on" data-m="hex">🍯 Petek</div>
  <div class="mode" data-m="draw">✏️ Çizim</div>
  <div class="mode" data-m="hood">🏘️ Mahalle</div>
</div>

<div class="palbar" id="palbar"></div>

<div class="wrap">
  <div id="map"></div>

  <div class="srch" id="srch">
    <div class="row"><input id="qh" placeholder="Mahalle / semt adı yaz (örn. Kızılay, Etlik)"></div>
    <div class="res" id="qres"></div>
  </div>

  <div class="hint" id="hint"><span class="x" onclick="document.getElementById('hint').style.display='none'">✕</span><span id="hintTxt"></span></div>

  <div class="sheet" id="sheet">
    <div class="hd">
      <span onclick="document.getElementById('sheet').classList.toggle('open')" style="display:flex;align-items:center;gap:8px;flex:1">
        <h4>Bölgelerim</h4><span class="cnt" id="zCnt">0</span><span class="ar">⌃</span>
      </span>
      <button class="btn gh" style="padding:6px 10px;font-size:12px" onclick="tumunuTemizle()">🗑 Tümünü temizle</button>
    </div>
    <div class="bd" id="zList"></div>
  </div>

  <div class="pbox" id="pbox">
    <h4>🎨 Renk paletin</h4>
    <div class="ph">Her renge bir getirme ücreti verirsin; haritayı o renkle boyarsın. Bir rengin ücretini değiştirirsen o renkle boyadığın tüm bölgeler de güncellenir.</div>
    <div id="prows"></div>
    <div class="pfoot">
      <button class="ek" onclick="paletSatirEkle()">+ Renk</button>
      <button class="sf" onclick="paletSifirla()">Sıfırla</button>
      <button class="kp" onclick="paletKaydet()">Tamam</button>
    </div>
  </div>

  <div class="att2">© OpenStreetMap</div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
<script>
// ===================== AYAR =====================
const API = {
  ZONES: "https://webhook.yemekchat.com/webhook/panel-zones",
  SAVE:  "https://webhook.yemekchat.com/webhook/panel-zones-save"
};
const HEX_GENISLIK_M = 500;  // petek genişliği (metre)
const SUB_DIVIDE     = 3;    // "Böl" ile kaça bölünsün (~170 m)
const REF_LAT        = 39;   // Türkiye ortalaması (ızgara ölçeği için)
// ================================================

const REST = localStorage.getItem("yc_rest");
if(!REST){ location.href = "restoran.html"; }

let map, zones = [], mode = "hex", hexLayer = null, dirty = false;
const $ = id => document.getElementById(id);

const HINTS = {
  hex:  "<b>🍯 Petek modu:</b> üstten bir <b>renk</b> seç, haritayı yaklaştır ve altıgenlere dokunarak boya. Tekrar dokunursan siler. Boyalı peteğe dokunup <b>Böl</b> dersen daha küçük parçalara ayrılır — sokak sokak farklı ücret verebilirsin.",
  draw: "<b>✏️ Çizim modu:</b> sağdaki araçlarla poligon, daire veya dikdörtgen çiz. Çizdiğin alan <b>seçili renkle</b> bölge olur. Şekli sonradan sürükleyip düzenleyebilirsin.",
  hood: "<b>🏘️ Mahalle modu:</b> yukarıya mahalle/semt adı yaz, listeden seç — sınırları otomatik çizilir ve <b>seçili renkle</b> eklenir. Sınır bulunamazsa 1 km'lik daire eklenir, sen düzeltirsin."
};

/* ---------- RENK PALETİ (restoran kendi düzenler) ---------- */
const PALET_VARSAYILAN = [
  { c:"#22C55E", u:0  },
  { c:"#A3E635", u:20 },
  { c:"#FACC15", u:30 },
  { c:"#FB923C", u:45 },
  { c:"#F43F5E", u:60 },
  { c:"#A855F7", u:90 }
];
const PALET_KEY = "yc_palet_" + REST;
let PALET = [], aktifRenk = 1;
try{
  const kayit = JSON.parse(localStorage.getItem(PALET_KEY) || "null");
  PALET = (Array.isArray(kayit) && kayit.length >= 2) ? kayit : PALET_VARSAYILAN.map(x => Object.assign({}, x));
}catch(e){ PALET = PALET_VARSAYILAN.map(x => Object.assign({}, x)); }

function paletYaz(){ try{ localStorage.setItem(PALET_KEY, JSON.stringify(PALET)); }catch(e){} }
function feeColor(u){
  u = Number(u)||0;
  const tam = PALET.find(p => Number(p.u) === u);
  if(tam) return tam.c;
  let en = PALET[0];
  PALET.forEach(p => { if(Math.abs(Number(p.u)-u) < Math.abs(Number(en.u)-u)) en = p; });
  return en ? en.c : "#9FE1CB";
}
function koyuMu(hex){
  const h = hex.replace("#",""); const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 150;
}
function paletCiz(){
  const el = $("palbar");
  el.innerHTML = PALET.map((p,i) =>
    `<div class="pchip ${i===aktifRenk?"on":""}" style="background:${p.c};color:${koyuMu(p.c)?"#fff":"#10231a"}" onclick="renkSec(${i})">${Number(p.u)===0?"Ücretsiz":Number(p.u)+"₺"}</div>`
  ).join("") + `<button class="pedit" onclick="paletAc()">🎨 Renkleri düzenle</button>`;
}
function renkSec(i){ aktifRenk = i; paletCiz(); }
function paletAc(){
  $("prows").innerHTML = PALET.map((p,i) =>
    `<div class="prow"><span>${i+1}</span><input type="color" value="${p.c}" onchange="PALET[${i}].c=this.value">
     <input type="number" inputmode="numeric" value="${p.u}" placeholder="Ücret ₺" data-i="${i}" class="pu">
     ${PALET.length>2?`<button class="sil" onclick="paletSatirSil(${i})">🗑</button>`:""}</div>`
  ).join("");
  $("pbox").classList.add("on");
}
function paletSatirEkle(){
  if(PALET.length >= 8){ toast("En fazla 8 renk"); return; }
  PALET.push({ c:"#38BDF8", u: (Number(PALET[PALET.length-1].u)||0) + 15 });
  paletAc();
}
function paletSatirSil(i){ PALET.splice(i,1); if(aktifRenk >= PALET.length) aktifRenk = PALET.length-1; paletAc(); }
function paletSifirla(){ PALET = PALET_VARSAYILAN.map(x => Object.assign({}, x)); aktifRenk = 1; paletAc(); }
function paletKaydet(){
  const eski = PALET.map(p => Number(p.u));
  document.querySelectorAll("#prows .pu").forEach(inp => {
    const i = +inp.dataset.i;
    if(PALET[i]) PALET[i].u = Math.max(0, Math.round(Number(inp.value)||0));
  });
  // ücreti değişen renklerle boyanmış bölgeleri güncelle
  let guncel = 0;
  PALET.forEach((p,i) => {
    const yeni = Number(p.u), onceki = eski[i];
    if(onceki === undefined || yeni === onceki) return;
    zones.forEach(z => {
      if(Number(z.ucret) === onceki){
        z.ucret = yeni;
        const col = feeColor(yeni);
        z.layer.setStyle({ color:col, fillColor:col }); etiketYaz(z);
        guncel++; dirty = true;
      }
    });
  });
  paletYaz(); paletCiz(); renderList();
  $("pbox").classList.remove("on");
  toast(guncel ? `Palet kaydedildi · ${guncel} bölge güncellendi` : "Palet kaydedildi");
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"), 2200); }
function curFee(){ const p = PALET[aktifRenk] || PALET[0]; return Math.max(0, Math.round(Number(p && p.u) || 0)); }

/* ---------- başlat (çağrı en altta) ---------- */
async function init(){
  $("rName").textContent = REST;
  map = L.map("map", { zoomControl:true, attributionControl:false }).setView([39.925, 32.866], 14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19 }).addTo(map);
  setMode("hex");

  map.pm.setGlobalOptions({ pathOptions:{ color:"#9FE1CB", weight:2, fillOpacity:.28 } });
  map.on("pm:create", e => {
    const l = e.layer;
    let gj;
    if(l instanceof L.Circle){
      const c = l.getLatLng();
      gj = turf.circle([c.lng, c.lat], l.getRadius()/1000, { steps:48, units:"kilometers" }).geometry;
    } else {
      gj = l.toGeoJSON().geometry;
    }
    map.removeLayer(l);
    addZone(gj, curFee(), "Çizim bölgesi");
    toast("Bölge eklendi");
  });

  try{
    const r = await fetch(`${API.ZONES}?restaurant=${encodeURIComponent(REST)}`);
    const d = await r.json();
    const lat = Number(d.latitude), lng = Number(d.longitude);
    if(lat && lng){
      map.setView([lat, lng], 15);
      L.marker([lat, lng], { icon: L.divIcon({ className:"", html:'<div class="me"></div>', iconSize:[16,16], iconAnchor:[8,8] }), zIndexOffset:900, interactive:false })
        .addTo(map).bindTooltip("📍 Restoranınız burada", { direction:"top", offset:[0,-10] });
    }
    $("rSub").textContent = (d.zones && d.zones.length) ? `${d.zones.length} bölge kayıtlı` : "henüz bölge yok — mesafeye göre ücret geçerli";
    (d.zones||[]).forEach(z => {
      const gj = typeof z.geom === "string" ? JSON.parse(z.geom) : z.geom;
      addZone(gj, z.ucret, z.ad || "Bölge", true);
    });
    dirty = false;
  }catch(e){ $("rSub").textContent = "bölgeler yüklenemedi"; }
}

/* ---------- mod ---------- */
document.querySelectorAll(".mode").forEach(m => m.onclick = () => setMode(m.dataset.m));
function setMode(m){
  mode = m;
  document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x.dataset.m===m));
  $("hintTxt").innerHTML = HINTS[m];
  $("hint").style.display = "block";
  $("srch").classList.toggle("on", m==="hood");
  if(map){
    map.pm.removeControls();
    if(m==="draw"){
      map.pm.addControls({ position:"topright", drawMarker:false, drawPolyline:false, drawText:false, drawCircleMarker:false, cutPolygon:false, rotateMode:false });
    }
    if(m==="hex") drawHexGrid(); else clearHexGrid();
  }
}

/* ---------- petek ızgarası (dünyaya sabit — zoom/kaydırma ile KAYMAZ) ---------- */
const HEX_R = (HEX_GENISLIK_M / 2) / Math.cos(REF_LAT * Math.PI / 180);  // EPSG:3857 metre
const SQ3 = Math.sqrt(3);
function prj(lat, lng){ const p = L.CRS.EPSG3857.project(L.latLng(lat, lng)); return [p.x, p.y]; }
function unprj(x, y){ const ll = L.CRS.EPSG3857.unproject(L.point(x, y)); return [ll.lng, ll.lat]; }
function hexPoly(q, r, R){
  const cx = 1.5 * R * q;
  const cy = SQ3 * R * (r + (((q % 2) + 2) % 2 === 1 ? 0.5 : 0));
  const ring = [];
  for(let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i;
    ring.push(unprj(cx + R * Math.cos(a), cy + R * Math.sin(a)));
  }
  ring.push(ring[0]);
  return { type:"Polygon", coordinates:[ring] };
}
function hexesInBounds(b, R, limit){
  const p1 = prj(b.getSouth(), b.getWest()), p2 = prj(b.getNorth(), b.getEast());
  const x0 = Math.min(p1[0], p2[0]), x1 = Math.max(p1[0], p2[0]);
  const y0 = Math.min(p1[1], p2[1]), y1 = Math.max(p1[1], p2[1]);
  const out = [];
  const qmin = Math.floor(x0 / (1.5 * R)) - 1, qmax = Math.ceil(x1 / (1.5 * R)) + 1;
  for(let q = qmin; q <= qmax; q++){
    const off = (((q % 2) + 2) % 2 === 1) ? 0.5 : 0;
    const rmin = Math.floor(y0 / (SQ3 * R) - off) - 1, rmax = Math.ceil(y1 / (SQ3 * R) - off) + 1;
    for(let r = rmin; r <= rmax; r++){
      out.push({ type:"Feature", properties:{ q, r }, geometry: hexPoly(q, r, R) });
      if(out.length > (limit || 1600)) return out;
    }
  }
  return out;
}
function clearHexGrid(){ if(hexLayer){ map.removeLayer(hexLayer); hexLayer=null; } }
function drawHexGrid(){
  clearHexGrid();
  if(map.getZoom() < 13){ toast("Petekler için haritayı yaklaştır"); return; }
  const feats = hexesInBounds(map.getBounds(), HEX_R);
  if(feats.length > 1500){ toast("Alan çok geniş, biraz yaklaş"); return; }
  const grid = { type:"FeatureCollection", features: feats };
  hexLayer = L.geoJSON(grid, {
    style:{ color:"#4a6b57", weight:1, fillOpacity:.05, fillColor:"#9FE1CB" },
    onEachFeature: (f, layer) => {
      layer.on("click", () => {
        const c = turf.centroid(f);
        const dolu = zones.some(z => turf.booleanPointInPolygon(c, z.gj));
        // bu peteğin içinde kalan her şeyi (alt bölgeler dahil) temizle
        let temizlenen = 0;
        for(let k = zones.length - 1; k >= 0; k--){
          if(turf.booleanPointInPolygon(turf.centroid(zones[k].gj), f.geometry)){ removeZone(k); temizlenen++; }
        }
        if(dolu){ toast(temizlenen > 1 ? `Petek temizlendi (${temizlenen} parça)` : "Petek çıkarıldı"); }
        else { addZone(f.geometry, curFee(), "Petek"); toast(`Petek eklendi · ${curFee()}₺`); }
      });
    }
  }).addTo(map);
  hexLayer.bringToBack();
}

/* ---------- bölge ekle/çıkar ---------- */
function zEtiket(u){ return Number(u) === 0 ? "Ücretsiz" : (Number(u)||0) + "₺"; }
function etiketYaz(z){
  const t = zEtiket(z.ucret);
  const tt = z.layer.getTooltip();
  if(tt) tt.setContent(t);
  else z.layer.bindTooltip(t, { permanent:true, direction:"center", className:"ftag" });
}
function addZone(gj, ucret, ad, sessiz){
  const col = feeColor(ucret);
  const u = Number(ucret)||0;
  const layer = L.geoJSON(gj, { style:{ color:col, weight:2.5, fillColor:col, fillOpacity:.45, opacity:.95 } }).addTo(map);
  layer.bindTooltip(zEtiket(u), { permanent:true, direction:"center", className:"ftag" });
  const z = { gj, ucret:u, ad:ad||"Bölge", layer };
  zones.push(z);
  layer.on("click", ev => { L.DomEvent.stopPropagation(ev); openZonePopup(z, ev.latlng); });
  if(!sessiz) dirty = true;
  renderList();
  return z;
}
function removeZone(i){
  if(!zones[i]) return;
  map.removeLayer(zones[i].layer);
  zones.splice(i,1); dirty = true; renderList();
}
function tumunuTemizle(){
  if(!zones.length) return;
  if(!confirm(`${zones.length} bölgenin hepsi silinecek. Emin misin?\n(Kaydet'e basmadan çıkarsan eski hâli korunur.)`)) return;
  zones.forEach(z => map.removeLayer(z.layer));
  zones = []; dirty = true; renderList(); toast("Tüm bölgeler temizlendi");
}
function openZonePopup(z, latlng){
  const i = zones.indexOf(z); if(i<0) return;
  const html = `<div class="pop"><b>${z.ad}</b> · ${z.ucret}₺<br>
    <button onclick="setZoneFee(${i})">Ücreti değiştir</button>
    <button onclick="splitZone(${i})">🍯 Böl</button>
    <button class="d" onclick="removeZone(${i});map.closePopup()">🗑 Sil</button></div>`;
  L.popup().setLatLng(latlng).setContent(html).openOn(map);
}
function setZoneFee(i){
  const z = zones[i]; if(!z) return;
  const v = prompt(`"${z.ad}" bölgesinin getirme ücreti (₺):`, z.ucret);
  if(v === null) return;
  const u = Math.max(0, Math.round(Number(v)||0));
  const col = feeColor(u);
  z.ucret = u; z.layer.setStyle({ color:col, fillColor:col }); etiketYaz(z);
  dirty = true; renderList(); map.closePopup(); toast(`Ücret ${u}₺ yapıldı`);
}
function splitZone(i){
  const z = zones[i]; if(!z) return;
  const ust = { type:"Feature", properties:{}, geometry: z.gj };
  const cells = hexesInBounds(z.layer.getBounds(), HEX_R / SUB_DIVIDE, 600);
  const parts = [];
  cells.forEach(f => {
    let kesisim = null;
    try{ kesisim = turf.intersect(f, ust); }catch(e){ kesisim = null; }
    if(!kesisim) return;
    const g = kesisim.geometry;
    const ekle = poly => { if(turf.area({ type:"Feature", properties:{}, geometry:poly }) > 1) parts.push(poly); };
    if(g.type === "Polygon") ekle(g);
    else if(g.type === "MultiPolygon") g.coordinates.forEach(c => ekle({ type:"Polygon", coordinates:c }));
  });
  if(parts.length < 2){ toast("Bu bölge daha fazla bölünemiyor"); return; }
  const eskiUcret = z.ucret;
  removeZone(i);
  parts.forEach(p => addZone(p, eskiUcret, "Alt bölge", true));
  dirty = true; renderList(); map.closePopup();
  toast(`${parts.length} parçaya bölündü — ücretlerini tek tek değiştirebilirsin`);
}

paletCiz();

/* ---------- liste ---------- */
function renderList(){
  $("zCnt").textContent = zones.length;
  $("zList").innerHTML = zones.length ? zones.map((z,i) =>
    `<div class="zr"><span class="sw" style="background:${feeColor(z.ucret)}"></span>
      <span class="zn">${z.ad}</span><span class="zu">${z.ucret}₺</span>
      <button onclick="map.fitBounds(zones[${i}].layer.getBounds())">🔍</button>
      <button onclick="removeZone(${i})">🗑</button></div>`
  ).join("") : '<div style="color:var(--txt3);font-size:12.5px;padding:8px 0 4px;line-height:1.7">Henüz bölge yok. Bölge eklemezsen <b style="color:var(--mint)">Ayarlar</b>\'daki mesafeye göre ücret (taban + km) geçerli olmaya devam eder.</div>';
}

/* ---------- mahalle arama (OpenStreetMap) ---------- */
let qTimer = null;
$("qh").addEventListener("input", () => {
  clearTimeout(qTimer);
  const q = $("qh").value.trim();
  if(q.length < 3){ $("qres").classList.remove("on"); return; }
  qTimer = setTimeout(() => searchHood(q), 700);
});
async function searchHood(q){
  try{
    const u = `https://nominatim.openstreetmap.org/search?format=json&polygon_geojson=1&countrycodes=tr&limit=6&q=${encodeURIComponent(q)}`;
    const r = await fetch(u, { headers:{ "Accept-Language":"tr" } });
    const d = await r.json();
    if(!d.length){ $("qres").innerHTML = '<div style="color:var(--txt3)">Sonuç yok</div>'; $("qres").classList.add("on"); return; }
    window._hood = d;
    $("qres").innerHTML = d.map((x,i) => `<div onclick="pickHood(${i})">${x.display_name.split(",").slice(0,3).join(",")}</div>`).join("");
    $("qres").classList.add("on");
  }catch(e){ toast("Arama yapılamadı"); }
}
function pickHood(i){
  const x = window._hood[i]; if(!x) return;
  const ad = x.display_name.split(",")[0];
  let gj = x.geojson;
  if(gj && gj.type === "Polygon"){ addZone(gj, curFee(), ad); }
  else if(gj && gj.type === "MultiPolygon"){ gj.coordinates.forEach(c => addZone({ type:"Polygon", coordinates:c }, curFee(), ad, true)); dirty=true; renderList(); }
  else { addZone(turf.circle([Number(x.lon), Number(x.lat)], 1, { steps:48, units:"kilometers" }).geometry, curFee(), ad + " (1 km)"); }
  $("qres").classList.remove("on"); $("qh").value = "";
  const last = zones[zones.length-1]; if(last) map.fitBounds(last.layer.getBounds());
  toast(`${ad} eklendi · ${curFee()}₺`);
}

/* ---------- kaydet ---------- */
$("btnSave").onclick = async () => {
  const btn = $("btnSave"); btn.disabled = true; btn.textContent = "Kaydediliyor…";
  try{
    const payload = { restaurant: REST, zones: zones.map(z => ({ ad:z.ad, ucret:z.ucret, geom:z.gj })) };
    const r = await fetch(API.SAVE, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
    const res = await r.json();
    if(res.ok){ dirty = false; toast(`✓ ${res.adet ?? zones.length} bölge kaydedildi`); $("rSub").textContent = `${zones.length} bölge kayıtlı`; }
    else toast("Kaydedilemedi");
  }catch(e){ toast("Bağlantı hatası"); }
  btn.disabled = false; btn.textContent = "💾 Kaydet";
};
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });
/* ---------- HER ŞEY TANIMLANDIKTAN SONRA BAŞLAT ---------- */
init().then(() => {
  map.on("moveend zoomend", () => { if(mode==="hex") drawHexGrid(); });
});
</script>
